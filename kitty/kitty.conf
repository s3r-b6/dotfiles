# Font Configuration
font_family      JetBrainsMono Nerd Font Mono
font_size 12.0

disable_ligatures cursor

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
# include dank-theme.conf
include current-theme.conf

enabled_layouts     fat:bias=70;full-size=1;mirrored=false

enable_audio_bell         no
visual_bell_duration      0.0
select_by_word_characters :@-./_~?&=%+#

wheel_scroll_multiplier 5.0
mouse_hide_wait         5.0
click_interval          0.5

open_url_with      default

# Clipboard
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# Windows
map alt+p new_window_with_cwd
map alt+q close_window_with_confirmation
map alt+[ previous_window
map alt+] next_window
map alt+n start_resizing_window

# Scrolling
map ctrl+shift+k         scroll_line_up
map ctrl+shift+j         scroll_line_down
map ctrl+shift+u         scroll_page_up
map ctrl+shift+d         scroll_page_down

#Font
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

map ctrl+shift+up        increase_font_size
map ctrl+shift+down      decrease_font_size
map ctrl+shift+backspace restore_font_size

# Scrollback
# in MB
scrollback_pager_history_size 5
map ctrl+h show_scrollback
scrollback_pager nvim -u NONE -R -M -c 'lua require("kitty+page")(INPUT_LINE_NUMBER, CURSOR_LINE, CURSOR_COLUMN)' -  
